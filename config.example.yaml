app:
  # Texto parcial de la ventana principal. En la foto aparece "Sistema Integrado TINI Ver. 12.15".
  title_re: ".*Sistema Integrado TINI.*"
  backend: "win32"
  connect_timeout_seconds: 30
  action_delay_seconds: 0.4

paths:
  output_dir: "artifacts/exports"
  inspect_dir: "artifacts/inspect"

webhook:
  url: "https://example.com/webhook"
  timeout_seconds: 60
  extra_headers: {}
  # Si tu webhook espera token:
  # extra_headers:
  #   Authorization: "Bearer CAMBIAR"

schedule:
  # yesterday: genera reporte del dia anterior.
  # today: genera reporte del dia actual.
  # explicit: usar from_date y to_date.
  date_mode: "yesterday"
  from_date: null
  to_date: null

export:
  # El visor de la foto tiene botones "Excel", "Acrobat" y "PrintDos".
  # Recomendado: excel si el sistema lo exporta directo.
  preferred_button_text: "Excel"
  report_viewer_title_re: ".*Movimientos por Articulo.*"
  # ActiveReports no expone Excel como Button; este punto es relativo a la ventana del visor.
  button_offset:
    x: 526
    y: 48
  save_timeout_seconds: 90

reports:
  - id: "pendientes_entrega"
    enabled: false
    module_tree_path:
      - "Control de Inventarios"
      - "Reportes"
      - "Reportes de Movimientos"
      - "Reporte de Pendientes de Entrega"
    window_title_re: ".*Pendientes de Entrega.*"
    fields:
      from_date:
        label: "Fecha desde:"
        value: "{from_date:%Y/%m/%d}"
      to_date:
        label: "Fecha hasta:"
        value: "{to_date:%Y/%m/%d}"
    options:
      radio_texts:
        - "Ventas Pendientes de Entrega"
        - "Por Comprobante"
      checkboxes:
        "Incluir Detalle de Entregas": false
    process_button_text: "Procesar Reporte"
    output_name: "pendientes_entrega_{from_date:%Y%m%d}_{to_date:%Y%m%d}"

  - id: "movimientos_producto"
    enabled: true
    # En TINI los paneles principales aparecen como AfxOleControl42, no como TreeView.
    # Por ahora se abre manualmente este formulario y el robot llena/procesa/exporta.
    skip_open: true
    module_tree_path:
      - "Control de Inventarios"
      - "Reportes"
      - "Movimiento por Articulo"
    window_title_re: ".*Reporte de Movimientos.*"
    viewer_title_re: ".*Movimientos por Articulo.*"
    fields:
      from_date:
        label: "Fecha Desde:"
        control_id: 5
        value: "{from_date:%Y/%m/%d}"
      to_date:
        label: "Hasta:"
        control_id: 24
        value: "{to_date:%Y/%m/%d}"
      article_from:
        label: "Articulo Desde:"
        control_id: 6
        value: ""
      article_to:
        label: "Hasta:"
        control_id: 7
        value: "zzzz"
    dropdown_controls:
      - label: "Bodega:"
        control_id: 10
        value: "Todas"
      - label: "Transaccion:"
        control_id: 11
        value: "Todas"
    options:
      radio_controls:
        - text: "Con Detalle de Movimientos"
          control_id: 8
        - text: "De Existencias"
          control_id: 13
    process_button_text: "Procesar"
    output_name: "movimientos_producto_{from_date:%Y%m%d}_{to_date:%Y%m%d}"
